['envelope13','Phong bì “mười ba cái tên”','Không có tên người gửi. Thời gian ở góc dưới: 03:14 AM.','env','GỬI NGƯỜI ĐANG TÌM KIẾM MƯỜI BA CÁI TÊN.'],['store_map','Sơ đồ lưu trữ cũ','Ba khu vực được đánh dấu; khu vực thứ ba không có trên sơ đồ hiện hành.','paper','SƠ ĐỒ LƯU TRỮ (bản in cũ)\n\n1. Kho hồ sơ hành chính\n2. Phòng lưu trữ của hội đồng quản trị\n3. Kho lưu trữ ngoại tuyến  ← không có trong sơ đồ hiện hành'],['printed_log','Nhật ký chuyển giao in sẵn','Mười ba hồ sơ đã bị chuyển khỏi danh mục thường vào một thời điểm chưa xác định.','report','NHẬT KÝ CHUYỂN GIAO (bản in)\n\n13 hồ sơ → khỏi DANH MỤC THƯỜNG\nĐích: —\nThời điểm: (trống)\nNgười thực hiện: (trống)'],['entry_book','Sổ ghi nhận người ra vào','Nhiều trang bị cắt. Vài dòng còn lại ghi một nhân viên kỹ thuật làm ca đêm.'],['cab_transfer','Tủ “Chuyển giao nội bộ”','Ngăn dưới cùng trống, nhưng có vết kéo thùng giấy rất mới.'],
['names_result','Nhóm học sinh bị chỉnh hồ sơ','Evelyn Hart, Lena Voss, Nora Ashby và Kai Okabe có thông tin bị chỉnh trong cùng giai đoạn.','report','KẾT QUẢ ĐỐI CHIẾU DANH SÁCH\n\n• Thiếu trong niên giám: Evelyn Hart, Lena Voss, Nora Ashby (+ Hayato Mori: lỗi in)\n• Chuyển trường không có biên nhận: Lena Voss, Nora Ashby, Kai Okabe\n• Sai lệch hành chính: Hayato Mori, Greta Lund, Marcus Tran'],['internal_list','Danh sách chuyển giao nội bộ','Một đợt chuyển dữ liệu đến kho ngoại tuyến, trùng giai đoạn ECHO bắt đầu chỉnh sửa bản ghi.','report','DANH SÁCH CHUYỂN GIAO NỘI BỘ\n\nĐích đến: KHO NGOẠI TUYẾN (KHU 3)\nSố lượng: 13 hồ sơ\nGiai đoạn: trùng thời điểm các bản ghi ECHO bắt đầu bị chỉnh sửa.'],
['server_log','Nhật ký máy chủ','03:14 — Lệnh truy cập. 03:23 — Tín hiệu chuông định kỳ.','report','NHẬT KÝ MÁY CHỦ\n\n03:14  LỆNH TRUY CẬP (SYS_MAINT)\n03:23  TÍN HIỆU CHUÔNG ĐỊNH KỲ'],['camera_log','Camera hành lang','02:50 một nhân viên rời phòng kỹ thuật. 02:58 hành lang trống.','report','CAMERA HÀNH LANG\n\n02:50  Một nhân viên rời phòng kỹ thuật\n02:58  Hành lang trống'],['audio_log','Bản ghi âm nội bộ','Ba tiếng chuông báo giờ, rồi thông báo bảo trì máy chủ.','report','BẢN GHI ÂM NỘI BỘ\n\nBa tiếng chuông báo giờ (3 giờ).\nThông báo: “Bảo trì máy chủ sau năm phút.”'],['time_analysis','Bản phân tích sai lệch thời gian','Đồng hồ máy chủ lệch +23 phút; lệnh “03:14” thực chất chạy lúc 02:51.','report','PHÂN TÍCH SAI LỆCH THỜI GIAN\n\nChuông 3 giờ (độc lập) được máy chủ ghi lúc 03:23 → đồng hồ máy chủ nhanh 23 phút.\nLệnh “03:14” = 02:51 thực tế.\nNhân viên rời phòng lúc 02:50.\n→ Lệnh có dấu hiệu được đặt lịch trước.'],['testimony_matrix','Ma trận lời khai','Ba lời khai không loại trừ nhau; chỉ một chi tiết bị chứng cứ độc lập bác bỏ.','report','MA TRẬN LỜI KHAI\n\n✔ Xác nhận: cửa khóa lúc 02:52; đồng hồ hành lang lệch giờ\n◐ Có thể đúng: một người bước ra sau chuông (cửa phụ không có camera)\n✖ Mâu thuẫn: “thông báo bảo trì trước tiếng chuông”\n? Không thể xác minh: ký ức về giờ; màu áo khoác'],
['admin_minutes','Bản sao biên bản quản trị','Ông Vale chỉ xác nhận khoản tài trợ; không có chữ ký ông về việc chuyển hồ sơ.','paper','BIÊN BẢN QUẢN TRỊ (bản sao)\n\nTài trợ dự án: ông Vale — XÁC NHẬN.\nVề việc chuyển hồ sơ: không có chữ ký của ông Vale.'],['east_photo','Ảnh đối chiếu khu nhà phía đông','Bảng thông báo cũ từng che một phần cửa phụ dẫn xuống tầng hầm.','paper','ẢNH ĐỐI CHIẾU\n\nVị trí cũ của bảng thông báo trùng với một cửa phụ.\nDấu đinh còn trên tường.'],['model_list','Bản kê dữ liệu của mô hình','Lucien liệt kê các loại dữ liệu từng dùng để dự đoán {name}.','report','BẢN KÊ DỮ LIỆU MÔ HÌNH\n\n• Lịch sử hội thoại\n• Thời gian phản hồi\n• Lựa chọn trong các tình huống giả định\n\nPhạm vi: xâm phạm quyền riêng tư. Đã đề nghị xóa.'],
['codes13','Danh sách mười ba mã hồ sơ','E-01 đến E-13. Một số mã đã đối chiếu: E-04 Lena Voss, E-07 Nora Ashby, E-09 Kai Okabe, E-13 Evelyn Hart.','report','MƯỜI BA MÃ HỒ SƠ\n\nE-04 Voss L. · E-07 Ashby N. · E-09 Okabe K. · E-13 Hart E.\n(các mã còn lại chưa đối chiếu)'],['transfer_order','Lệnh chuyển giao nội bộ','Người ra lệnh: S. Hollis. Người thực hiện: T. Marlowe.','report','LỆNH CHUYỂN GIAO NỘI BỘ\n\nChuyển 13 hồ sơ sang kho ngoại tuyến.\nNgười ra lệnh: S. Hollis (Hiệu trưởng)\nNgười thực hiện: T. Marlowe\nGhi chú: “Không đưa vào danh mục bàn giao.”'],['offline_device','Thiết bị lưu trữ ngoại tuyến','Chưa kết nối mạng. Cần xác minh bản gốc trước khi dùng.'],['eve_env','Phong bì đề tên Evelyn Hart','Bên trong có mảnh giấy chép tay.','env','EVELYN HART'],['eve_note2','Mảnh giấy trong phong bì','“Hãy kiểm tra bản gốc trước khi tin vào bất kỳ bản sao nào.”','paper','“Nếu các em tìm thấy nơi này, hãy kiểm tra bản gốc trước khi tin vào bất kỳ bản sao nào.”\n\nMã niêm phong: 7F3A-92C1'],
['echo_export','Bản xuất E-13 từ ECHO','Mã kiểm tra 7F3A-92C7, sửa lần cuối mười hai năm trước.','report','BẢN XUẤT TỪ ECHO — E-13\n\nMã kiểm tra: 7F3A-92C7\nSửa lần cuối: 12 năm trước'],['verified_original','Bản gốc E-13 đã xác minh','Mã 7F3A-92C1 khớp mã niêm phong của Evelyn.','report','BẢN GỐC E-13 — ĐÃ XÁC MINH\n\nMã kiểm tra: 7F3A-92C1 (khớp mã niêm phong)\nSiêu dữ liệu nguyên vẹn.'],['admission_form','Đơn nhập viện của Evelyn','“Tự nguyện”, do Marlowe chứng kiến, Hollis phê duyệt.','report','ĐƠN NHẬP VIỆN — HART, EVELYN\n\nHình thức: “tự nguyện”\nPhụ huynh: (chữ ký: H. Hart)\nChứng kiến: T. Marlowe\nPhê duyệt: S. Hollis'],['visit_ledger','Sổ thăm bệnh','Chỉ có một người ghi tên thăm Evelyn mỗi tuần: T. Marlowe.','report','SỔ THĂM BỆNH (Phòng 13)\n\nMỗi thứ Năm: T. Marlowe — “mang giấy tờ”.\nKhông có tên phụ huynh nào.'],['nurse_note','Ghi chú của y tá','Dòng chữ tay: “Đừng báo Marlowe.”','paper','LỊCH THUỐC PHÒNG 13\n\n17/10 — NGỪNG.\n\n(viết tay) “Đừng báo Marlowe.”'],['guardian_sample','Mẫu chữ ký của bà Hart','Thư thật của mẹ Evelyn, nhà dưỡng bệnh chưa từng chuyển cho cô.','paper','Con gái yêu,\nMẹ sẽ gọi con ngay khi chuyến bay hạ cánh.\n\n— H. Hart (nét liền, nghiêng trái, mực đen)'],['eve_letter','Thư của Evelyn','Lời nhắn gửi người đầu tiên tìm thấy mười ba cái tên.','letter','Gửi người đầu tiên tìm thấy mười ba cái tên,\n\nNếu em đang đọc thư này, nghĩa là chị đã không thể tự lên tiếng. Họ nói chị bệnh. Chị không bệnh. Chị chỉ từ chối ký vào điều họ muốn.\n\nChị không đòi trả thù. Chị chỉ xin em một điều: đừng để ai trong mười hai người còn lại bị phơi bày chỉ để câu chuyện của chị nghe có sức nặng hơn. Hãy hỏi họ trước. Hãy để họ tự chọn.\n\nHãy kiểm tra bản gốc trước khi tin vào bất kỳ bản sao nào. Kể cả bản sao do chính chị để lại.\n\nP.S. Chị đã xin họ không đánh dấu tên đứa nhỏ đi cùng chị hôm đó. Chị mong họ đã giữ lời.\n\n— E.H.']]);

openJ=function(tab){tab=typeof tab=='string'?tab:'rel';const T=[['rel','Quan hệ'],['clu','Manh mối'],['hyp','Giả thuyết'],['cmp','Đối chiếu'],['end','Ending']];let h=`<div class="jh"><div class="jt1">SỔ ĐIỀU TRA</div><div class="dm">${CHT[S.chap||0]} · Ngày ${S.day} ${TIMES[S.time]}</div></div><div class="tabs">${T.map(x=>`<button class="b tab ${x[0]==tab?'on':''}" onclick="openJ('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
if(tab=='rel')ROUTES.forEach(r=>{const rl=S.rel[r];h+=`<div class="cd"><img class="av" src="${ASSETS.portrait[r+'_'+AV[r]]}"><div class="cx"><b>${CH[r].n}</b><div class="dm">${ROLE[r]} · ${stt(rl)}</div>${[['aff','♥','#ff6a8a'],['trust','◆','#6ab4ff'],['resp','★','#ffd25a']].map(([k,i,c])=>`<div class="bl"><span style="color:${c}">${i}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,rl[k]))}%;background:${c}"></i></div><em>${rl[k]}</em></div>`).join('')}</div></div>`});
else if(tab=='clu'){const ks=Object.keys(CLUES);h+=`<div class="dm">Đã thu thập ${S.clues.length}/${ks.length}</div><div class="bar"><i style="width:${S.clues.length/ks.length*100}%"></i></div>`;ks.forEach(c=>{const o=S.clues.includes(c);h+=o?`<div class="cl"><img src="${DI(c)}"><div style="flex:1"><b>${CLUES[c][0]}</b><div class="dm" style="font-size:12px">${fill(CLUES[c][1])}</div></div>${DOCS[c]?`<button class="b" onclick="viewDoc('${c}')">Mở</button>`:''}</div>`:`<div class="cl lk"><img src="${icoR(ICOD.paper)}"><b>???</b></div>`})}
else if(tab=='hyp'){h+='<div class="dm">Giả thuyết tự cập nhật theo chứng cứ bạn đã có và đã đối chiếu.</div>';HYP.forEach(([t,f])=>{const s=f();h+=`<div class="cl" style="border-left-color:${s[1]}"><div style="flex:1"><b>${t}</b></div><em style="color:${s[1]};font-style:normal;font-size:12px">${s[0]}</em></div>`})}
else if(tab=='cmp'){const own=S.clues.filter(c=>CLUES[c]),op=own.map(c=>`<option value="${c}">${CLUES[c][0]}</option>`).join('');h+=`<div class="dm">Chọn hai chứng cứ để xem chúng có liên hệ với nhau không.</div><div class="row"><select id="ca" class="sel">${op}</select><select id="cb" class="sel">${op}</select></div><button class="b go" id="cbtn">Đối chiếu</button><p id="cres" style="min-height:44px"></p><h3>Đã phát hiện</h3>`+(CMP.filter(l=>S.flags[l[2]]).map(l=>`<div class="cl"><div class="dm" style="font-size:12px">${l[3]}</div></div>`).join('')||'<span class="dm">Chưa có.</span>')}
else{h+=`<div class="dm">Ending đã mở ${(S.endings||[]).length}/${ENDS.length}</div><div class="eg">${ENDS.map(e=>{const o=(S.endings||[]).includes(e[0]);return`<div class="ec ${o?'on':''} ${e[0]=='END_TRUE'?'tr':''}"><div class="dm">${o?e[1]:'???'}</div><b>${o?e[2]:'Chưa mở'}</b></div>`}).join('')}</div>`}
show(h+'<div class="row" style="margin-top:14px"><button class="b" onclick="hide()">Đóng</button></div>');
if(tab=='cmp'&&$('#cbtn'))$('#cbtn').onclick=()=>{const a=$('#ca').value,b=$('#cb').value,l=CMP.find(l=>(l[0]==a&&l[1]==b)||(l[0]==b&&l[1]==a));if(l){if(!S.flags[l[2]]){fx(['flag:'+l[2]]);sfx('clue')}$('#cres').innerHTML='<b style="color:#4ade80">Có liên hệ:</b> '+l[3]}else{sfx('buzz');$('#cres').textContent='Hai tài liệu này chưa cho thấy mối liên hệ rõ ràng.'}}};
